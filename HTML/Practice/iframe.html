<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Embedding Iframes in HTML</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/k2DSi1zGEc8?si=rRajVsZJ_Q0xjYUm" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>

<!-- Iframe:
Iframe is an HTML element that allows you to embed another HTML document within the current document. It creates a rectangular area on the page where the content of the embedded document is displayed. Iframes are commonly used to embed external content, such as videos, maps, or other web pages, into a webpage.
The <iframe> tag is used to create an iframe. It has several attributes that can be used to customize its behavior and appearance. Some of the commonly used attributes include:
1. src: Specifies the URL of the document to be embedded within the iframe.
2. width: Specifies the width of the iframe in pixels or as a percentage of the parent element.
3. height: Specifies the height of the iframe in pixels or as a percentage of the parent element.
4. frameborder: Specifies whether the iframe should have a border (1) or not (0). This attribute is deprecated in HTML5, and CSS should be used for styling instead.
5. allowfullscreen: Allows the iframe content to be displayed in fullscreen mode when supported by the embedded content.

We can embed any youtube video or any website using iframe tag. The src attribute of the iframe tag should contain the URL of the video or website you want to embed.But the website and youtube should allow embedding. Some websites may have restrictions on embedding their content in iframes, so it's important to check the website's policies before attempting to embed it. -->
