<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogPage - Atharva's Blog</title>
</head>

<body>

    <header>
        <h1>Welcome to Atharva's Blog</h1>
    </header>

    <!-- Header tag is used to define the header section of a webpage. -->

    <main>

        <!-- Main tag defines the main content of a webpage. -->

        <section>

            <!-- Section tag is used to group related content. -->

            <article>

                <!-- Article tag defines self-contained content. -->

                <h2>My Learning Journey</h2>

                <p>
                    I am currently learning HTML and exploring
                    different HTML tags used to create webpages.
                </p>

            </article>

        </section>

        <aside>

            <!-- Aside tag contains supplementary content. -->

            <h3>About My Blog</h3>

            <p>
                This blog is created as part of my frontend
                development learning journey.
            </p>

        </aside>

    </main>

    <footer>

        <!-- Footer tag defines the footer section of a webpage. -->

        <p>
            © 2026 Atharva's Blog
        </p>

    </footer>

</body>

</html>
