<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video-HTML</title>
</head>
<body>
    <H2>Embedding Videos in HTML</H2>
    <video src="video.mp4" autoplay muted controls>Sorry Unable to play video</video><br><br>
    <video width="640" autoplay loop>
        <source src="harry.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>
</html>


<!-- 
Attributes of video tag:
1. src: Specifies the path to the video file.
2. autoplay: Automatically starts playing the video when the page loads.
3. muted: Mutes the audio of the video.
4. controls: Displays video controls (play, pause, volume, etc.) for user interaction.
5. loop: Makes the video play in a continuous loop.
5. width: Specifies the width of the video player.
6. height: Specifies the height of the video player.
7. poster: Specifies an image to be shown while the video is downloading or until the user hits the play button.
8. preload: Specifies if and how the video should be loaded when the page loads. Options are "auto", "metadata", or "none". -->
