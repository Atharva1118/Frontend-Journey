<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery at your door step</title>
    <style>
        /* Reset default spacing */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body Styling */
body {
    font-family: Arial, sans-serif;
    background-color: #fff5f5;
    color: #333;
}

/* Header Styling */
header {
    background-color: #e23744;
    color: white;
    padding: 20px 60px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Logo */
header div:first-child {
    font-size: 32px;
    font-weight: bold;
}

/* Navigation Links */
header div:last-child {
    display: flex;
    gap: 25px;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;

    transition: color 0.3s ease;
}

header a:hover {
    color: #ffd6d9;
}

/* Main Section */
main {
    min-height: 75vh;
    padding: 100px 20px;
    text-align: center;
}

/* Main Heading */
main div {
    font-size: 40px;
    font-weight: bold;
    color: #e23744;
    margin-bottom: 25px;
}

/* Description */
main p {
    max-width: 700px;
    margin: auto;

    font-size: 18px;
    line-height: 1.8;
    color: #555;
}

/* Footer */
footer {
    background-color: #2b2b2b;
    color: white;

    text-align: center;
    padding: 20px;

    font-size: 14px;
}
    </style>
</head>
<body>
    <header>
        <div>Zomato</div>
        <div>
            <a href="/home">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>
    </header>
    <main>
        <div>Order food anywhere any time</div>
        <p>Zomato is a major Indian online food service platform that lets people discover restaurants, read user reviews, and order food for home delivery</p>
    </main>
    <footer>
        Copyright &copy; 2026 Zomato. All rights reserved.
    </footer>
</body>
</html>
